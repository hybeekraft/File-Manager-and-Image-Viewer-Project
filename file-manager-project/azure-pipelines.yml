trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: BuildBackend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              cd backend
              npm ci
              npx prisma generate
              npm run build
              npm test
            displayName: Build and test backend

      - job: BuildFrontend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: Build frontend

  - stage: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeploymentPlaceholder
        steps:
          - script: echo "Add Azure App Service deployment here after creating the Azure resource."
            displayName: Deployment placeholder
