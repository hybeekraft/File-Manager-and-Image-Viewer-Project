services:
  - type: web
    name: file-manager-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: file-manager-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 20

databases:
  - name: file-manager-db
    plan: free
